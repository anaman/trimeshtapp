; PlatformIO config for ESP32-C6 WiFi Mesh Server
; See DESIGN.md for architecture details
;
; Build: pio run -e c6-wifi-server
; Upload: pio run -e c6-wifi-server -t upload
; Monitor: pio device monitor -e c6-wifi-server

[platformio]
default_envs = c6-wifi-server
boards_dir = boards

[common]
build_flags =
  -D ESP32_PLATFORM
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1

[env:c6-wifi-server]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13-1/platform-espressif32.zip
board = esp32-c6-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
  ${common.build_flags}
  ; WiFi credentials (2.4 GHz required — C6 has no 5 GHz radio)
  -D WIFI_SSID='"YOUR_WIFI_SSID"'
  -D WIFI_PWD='"YOUR_WIFI_PASSWORD"'
  ; MQTT broker (set to your broker; TLS optional)
  -D MQTT_BROKER='"mqtt.example.com"'
  -D MQTT_PORT=8883
  -D MQTT_TLS=1
  -D MQTT_TOPIC='"mesh/c6/frames"'
  -D MQTT_USER='"c6"'
  -D MQTT_PASS='"YOUR_MQTT_PASSWORD"'   ; dedicated broker user for the C6
  ; V3 nodes: discovered via mDNS (_meshcore._tcp). Static fallback IPs optional.
  -D NODE_ADDRESSES='""'
  -D NODE_PORT=5000
  ; Status server
  -D STATUS_PORT=80
  -D MDNS_NAME='"c6-mesh-server"'
  ; Debug
  -D C6_DEBUG_LOG=1
  ; Status LCD — Waveshare ESP32-C6-LCD-1.47 (ST7789 172x320)
  -D HAS_LCD=1
  -D LCD_MOSI=6
  -D LCD_SCLK=7
  -D LCD_CS=14
  -D LCD_DC=15
  -D LCD_RST=21
  -D LCD_BL=22
  -D LCD_BRIGHTNESS=128

lib_deps =
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.0
  moononournation/GFX Library for Arduino @ ^1.5.0

monitor_filters = esp32_exception_decoder
