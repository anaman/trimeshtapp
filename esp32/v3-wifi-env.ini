; V3 node firmware env with WiFi interface + OLED display enabled
; (rev2 2026-09-14)
;
; This makes the Heltec V3 node:
;   - connect to WiFi as a station
;   - listen on TCP port 5000 (SerialWifiInterface) for the C6 hub
;   - advertise `_meshcore._tcp` via mDNS so the C6 finds it automatically
;   - drive its SSD1306 OLED (auto-off after 5 minutes idle)
;
; The node continues to operate as a LoRa mesh node (SX1262 radio).
;
; Build: pio run -e Heltec_v3_companion_wifi -t upload --upload-port /dev/ttyUSBx
;
; NOTE: this env is defined in meshcore-src/platformio.ini; this file is the
; reference copy. rev1 omitted DISPLAY_CLASS, which left the OLED dark.

[env:Heltec_v3_companion_wifi]
extends = Heltec_lora32_v3
build_flags =
  ${Heltec_lora32_v3.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=SSD1306Display
  -D AUTO_OFF_MILLIS=300000     ; OLED sleeps after 5 min idle (button/serial wakes it)
  -D BLE_PIN_CODE=123456
  -D OFFLINE_QUEUE_SIZE=256
  -D ENABLE_PRIVATE_KEY_IMPORT=1
  -D ENABLE_PRIVATE_KEY_EXPORT=1
  ; WiFi interface — SerialWifiInterface on TCP port 5000
  -D WIFI_SSID='"YOUR_WIFI_SSID"'
  -D WIFI_PWD='"YOUR_WIFI_PASSWORD"'
  -D TCP_PORT=5000
  -D WIFI_DEBUG_LOGGING=1
  ; mDNS advertising so the C6 hub discovers this node (_meshcore._tcp)
  -D MDNS_ADVERTISE=1
build_src_filter =
  ${Heltec_lora32_v3.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<helpers/esp32/*.cpp>
  -<helpers/esp32/ESPNOWRadio.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_lora32_v3.lib_deps}
  densaugeo/base64 @ ~1.4.0
